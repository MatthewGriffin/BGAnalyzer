[project]
name = "bganalyzer"
version = "0.1.0"
description = "Native Linux application for reviewing Nightscout glucose, insulin, meal, and AAPS data"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.7,<6.8",
    "pydantic>=2.8,<2.9",
    "pydantic-settings>=2.3,<2.4",
    "httpx>=0.27,<0.28",
    "pymongo>=4.10,<5",
    "numpy>=1.26,<1.27",
    "scipy>=1.13,<1.14",
    "pyqtgraph>=0.13,<0.14",
    "keyring>=25.0,<26.0",
    "python-dotenv>=1.0,<1.1",
    "tzdata>=2024.1",
    "pyyaml>=6.0,<6.1",
    "jsonschema>=4.22,<4.23",
    "structlog>=24.0,<25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<8.3",
    "pytest-qt>=4.4,<4.5",
    "pytest-asyncio>=0.23,<0.24",
    "hypothesis>=6.100,<6.101",
    "respx>=0.21,<0.22",
    "ruff>=0.5,<0.6",
    "mypy>=1.10,<1.11",
    "coverage>=7.5,<7.6",
]

[project.scripts]
bganalyzer = "bganalyzer.__main__:main"

[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bganalyzer*"]

[tool.ruff]
target-version = "py312"
line-length = 100
lint.select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "T20", "ARG"]
lint.ignore = ["S101", "ARG001", "ARG002"]
src = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "PySide6.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2,<8.3",
    "pytest-qt>=4.4,<4.5",
    "pytest-asyncio>=0.23,<0.24",
    "hypothesis>=6.100,<6.101",
    "respx>=0.21,<0.22",
    "ruff>=0.5,<0.6",
    "mypy>=1.10,<1.11",
    "coverage>=7.5,<7.6",
]